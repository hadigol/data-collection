name: CI Pipeline

on: 
  pull_request:

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  check-merge:
    runs-on: ubuntu-latest
    steps:
      - name: merging into stage
        if: github.base_ref == 'stage' && github.head_ref != 'devel'
        run: |
          echo "Merges into Stage Must come from devel"
          exit 1
      
      - name: merging into prod
        if: github.base_ref == 'prod' && github.head_ref != 'stage'
        run: |
          echo "Merges into Prod Must come from Stage"
          exit 1

      - name: merging into devel
        if: github.base_ref == 'devel'
        run: |
          echo "PR merging into devel, checking name convetions"
          if [[ ! "${{github.head_ref }}" =~ ^(feature|bugfix)/ ]]; then
            echo "ERROR: PR source branch into devel must start with either feature/ or bugfix/"
            exit 1
          fi
  build:
    runs-on: ubuntu-latest
    needs: 
      - check-merge
    steps: 
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '15'

      - name: Install dependencies
        run: npm install

      - name: Run linter
        run: npm run lint

      - name: Run formatter
        run: npm run prettier

      - name: Run tests
        env: 
          CI: true
        run: npm run test

      - name: Build project
        run: npm run build

      - name : upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: upload-build
          path: public/

  setup-terraform-deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.base_ref }}
    needs:
      - check-merge
      - build
    defaults:
      run:
        working-directory: terraform/${{ github.base_ref }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4.1.0
        with:
          role-to-assume: arn:aws:iam::734579227127:role/Fullstack-github
          aws-region: us-west-2
          audience: sts.amazonaws.com

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan

      - name: Terraform Apply
        run: terraform apply -var="env=devel-${{github.run_id}}" -auto-approve

      - name: Get Terraform Output-Bucket Name
        id: tf_output_bucket_name
        run: |
          echo "bucket_name=$(terraform output -raw bucket_name)" >> $GITHUB_OUTPUT

      - name: Get Terraform Output-CloudFront Distribution ID
        id: tf_output_cloudfront_distribution_id
        run: |
          echo "cloudfront_distribution_id=$(terraform output -raw cloudfront_distribution_id)" >> $GITHUB_OUTPUT

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: upload-build
          path: public/
      - name: Display structure of downloaded files
        run: ls -R public/

      - name: Copy build artifacts to S3
        run: |
          aws s3 sync public/ s3://${{ steps.tf_output_bucket_name.outputs.bucket_name }} --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ steps.tf_output_cloudfront_distribution_id.outputs.cloudfront_distribution_id }} \
            --paths "/*"

      - name: Destroy Terraform
        if: always() && github.base_ref == 'devel'
        run: terraform destroy -auto-approve