name: CI Pipeline

on: 
  pull_request:

jobs:
  check-merge:
    runs-on: ubuntu-latest
    steps:
      - name: merging into stage
        if: github.base_ref == 'stage' && github.head_ref != 'devel'
        run: |
          echo "Merges into Stage Must come from devel"
          exit 1
      
      - name: merging into prod
        if: github.base_ref == 'prod' && github.head_ref != 'stage'
        run: |
          echo "Merges into Prod Must come from Stage"
          exit 1

      - name: merging into devel
        if: github.base_ref == 'devel'
        run: |
          echo "PR merging into devel, checking name convetions"
          if [[ ! "${{github.head_ref }}" =~ ^(feature|bugfix)/ ]]; then
            echo "ERROR: PR source branch into devel must start with either feature/ or bugfix/"
            exit 1
          fi
  build:
    runs-on: ubuntu-latest
    needs: 
      - check-merge
    steps: 
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '15'

      - name: Install dependencies
        run: npm install

      - name: Run linter
        run: npm run lint

      - name: Run formatter
        run: npm run prettier

      - name: Run tests
        env: 
          CI: true
        run: npm run test

      - name: Build project
        run: npm run build

      - name : upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: upload-build
          path: public
      
      